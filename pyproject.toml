[project]
name = "customer-churn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "structlog>=24.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "optuna>=3.6",
    "skl2onnx>=1.16",
    "onnxmltools>=1.12",
    "onnxruntime>=1.17",
    "mlflow>=2.12",
    "streamlit>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
